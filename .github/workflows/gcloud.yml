name: Deploy to Google Cloud

on:
    push:
        branches: ["main"]
    workflow_dispatch:

jobs:
    build-client:
        runs-on: ubuntu-latest
        environment: gcloud
        env:
            REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
            REACT_APP_BASE_URL: ${{ vars.REACT_APP_BASE_URL }}
            REACT_APP_GTM_ID: ${{ vars.REACT_APP_GTM_ID }}
        outputs:
            version: ${{ steps.build-client.outputs.version }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Build client
              working-directory: client
              id: build-client
              run: |
                  TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")"
                  COMMIT_SHA="$(git rev-parse --short HEAD)"
                  export REACT_APP_VERSION="${TAG#v}-gcloud+${COMMIT_SHA}"
                  echo "version=$REACT_APP_VERSION" >> $GITHUB_OUTPUT

                  npm install -g pnpm@10.33.0
                  pnpm install --frozen-lockfile
                  pnpm build

            - name: Create 404.html from index.html
              working-directory: client/build
              run: cp index.html 404.html

            - name: Upload client build
              uses: actions/upload-artifact@v4
              with:
                  name: client-build
                  path: client/build

    build-server:
        runs-on: ubuntu-latest
        environment: gcloud
        outputs:
            image: ${{ steps.set-image.outputs.image }}
            commit: ${{ steps.set-image.outputs.commit }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GCP_SA_KEY }}

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@v2
              with:
                  project_id: ${{ vars.GCP_PROJECT_ID }}

            - name: Configure Docker
              run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

            - name: Build and push server image
              working-directory: server
              id: set-image
              run: |
                  IMAGE_BASE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.GCP_CLOUD_RUN_SERVICE }}"
                  COMMIT_SHA="$(git rev-parse --short HEAD)"
                  IMAGE_SHA="$IMAGE_BASE:$COMMIT_SHA"
                  IMAGE_LATEST="$IMAGE_BASE:latest"

                  docker build \
                    -t "$IMAGE_SHA" \
                    -t "$IMAGE_LATEST" \
                    .
                  docker push "$IMAGE_SHA"
                  docker push "$IMAGE_LATEST"

                  echo "image=$IMAGE_SHA" >> $GITHUB_OUTPUT
                  echo "commit=$COMMIT_SHA" >> $GITHUB_OUTPUT

    deploy:
        runs-on: ubuntu-latest
        environment: gcloud
        needs: [build-client, build-server]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GCP_SA_KEY }}

            - name: Activate service account
              run: |
                  cat <<EOF > key.json
                  ${{ secrets.GCP_SA_KEY }}
                  EOF
                  gcloud auth activate-service-account --key-file=key.json
                  rm key.json

            - name: Download client build
              uses: actions/download-artifact@v4
              with:
                  name: client-build
                  path: build

            - name: Upload client to GCS
              run: |
                  gsutil -m rsync -r build gs://${{ vars.GCP_BUCKET }}

            - name: Sync secrets to Secret Manager
              env:
                  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
                  JWT_SECRET: ${{ secrets.JWT_SECRET }}
                  MONGODB_URI: ${{ secrets.MONGODB_URI }}
                  RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
                  SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
                  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
              run: |
                  set -euo pipefail

                  required_secrets="GOOGLE_CLIENT_SECRET JWT_SECRET MONGODB_URI \
                                    SESSION_SECRET SMTP_PASSWORD"
                  optional_secrets="RECAPTCHA_SECRET_KEY"

                  sync_secret() {
                    local name="$1" value="$2" current=""

                    gcloud secrets describe "$name" >/dev/null 2>&1 \
                      || gcloud secrets create "$name" --replication-policy=automatic

                    current="$(gcloud secrets versions access latest --secret="$name" 2>/dev/null || true)"
                    if [ "$current" = "$value" ]; then
                      echo "$name unchanged"
                    else
                      printf '%s' "$value" | gcloud secrets versions add "$name" --data-file=-
                      echo "$name updated"
                    fi
                  }

                  mapping=""
                  for name in $required_secrets; do
                    value="${!name-}"
                    if [ -z "$value" ]; then
                      echo "::error::Required GitHub secret $name is empty - refusing to deploy"
                      exit 1
                    fi
                    sync_secret "$name" "$value"
                    mapping="${mapping:+$mapping,}$name=$name:latest"
                  done

                  for name in $optional_secrets; do
                    value="${!name-}"
                    if [ -z "$value" ]; then
                      echo "::warning::Optional secret $name is unset - not bound to Cloud Run"
                    else
                      sync_secret "$name" "$value"
                      mapping="${mapping:+$mapping,}$name=$name:latest"
                    fi
                  done

                  echo "SECRETS_MAPPING=$mapping" >> "$GITHUB_ENV"
                  echo "Secrets bound: $mapping"

            - name: Write Cloud Run env vars file
              env:
                  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
                  LOG_LEVEL: ${{ vars.LOG_LEVEL }}
                  NODE_ENV: ${{ vars.NODE_ENV }}
                  REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
                  REACT_APP_BASE_URL: ${{ vars.REACT_APP_BASE_URL }}
                  REACT_APP_GTM_ID: ${{ vars.REACT_APP_GTM_ID }}
                  REACT_APP_VERSION: ${{ needs.build-client.outputs.version }}
                  SALT_ROUNDS: ${{ vars.SALT_ROUNDS }}
                  SESSION_COOKIE_DOMAIN: ${{ vars.SESSION_COOKIE_DOMAIN }}
                  SMTP_HOST: ${{ vars.SMTP_HOST }}
                  SMTP_PORT: ${{ vars.SMTP_PORT }}
                  SMTP_SENDER: ${{ vars.SMTP_SENDER }}
                  SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
                  TOKEN_SIZE: ${{ vars.TOKEN_SIZE }}
              run: |
                  set -euo pipefail

                  required_keys="GOOGLE_CLIENT_ID NODE_ENV REACT_APP_API_URL \
                                 REACT_APP_BASE_URL REACT_APP_GTM_ID SESSION_COOKIE_DOMAIN \
                                 SMTP_HOST SMTP_PORT SMTP_USERNAME"
                  optional_keys="LOG_LEVEL REACT_APP_VERSION SALT_ROUNDS SMTP_SENDER TOKEN_SIZE"

                  emit() {
                    printf "%s: '%s'\n" "$1" "$(printf '%s' "$2" | sed "s/'/''/g")" >> env.yaml
                  }

                  : > env.yaml
                  for key in $required_keys; do
                    value="${!key-}"
                    if [ -z "$value" ]; then
                      echo "::error::Required GitHub variable $key is empty - refusing to deploy"
                      exit 1
                    fi
                    emit "$key" "$value"
                  done

                  for key in $optional_keys; do
                    value="${!key-}"
                    if [ -z "$value" ]; then
                      echo "::warning::Optional variable $key is unset - server default applies"
                    else
                      emit "$key" "$value"
                    fi
                  done

                  emit HOSTNAME "0.0.0.0"

                  echo "Variables written to env.yaml:"
                  cut -d: -f1 env.yaml

            - name: Deploy server to Cloud Run
              run: |
                  IMAGE_SHA="${{ needs.build-server.outputs.image }}"
                  COMMIT_SHA="${{ needs.build-server.outputs.commit }}"

                  DEPLOY_CMD="gcloud run deploy ${{ vars.GCP_CLOUD_RUN_SERVICE }} \
                    --image ${{ needs.build-server.outputs.image }} \
                    --region ${{ vars.GCP_REGION }} \
                    --platform managed \
                    --allow-unauthenticated \
                    --revision-suffix=$COMMIT_SHA \
                    --env-vars-file=env.yaml \
                    --set-secrets=$SECRETS_MAPPING"

                  if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
                    DEPLOY_CMD="$DEPLOY_CMD --revision-tags=${GITHUB_REF_NAME}"
                  fi

                  eval "$DEPLOY_CMD"

            - name: Delete old Cloud Run revisions
              run: |
                  SERVICE=${{ vars.GCP_CLOUD_RUN_SERVICE }}
                  REGION=${{ vars.GCP_REGION }}
                  COMMIT_SHA="${{ needs.build-server.outputs.commit }}"
                  for R in $(gcloud run revisions list --service $SERVICE --region $REGION --format="value(metadata.name)" | grep -v $COMMIT_SHA); do
                    gcloud run revisions delete $R --region $REGION --quiet
                  done

            - name: Delete old server images
              run: |
                  IMAGE_BASE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.GCP_CLOUD_RUN_SERVICE }}"
                  COMMIT_SHA="${{ needs.build-server.outputs.commit }}"

                  for TAG in $(gcloud artifacts docker images list $IMAGE_BASE --include-tags --format="value(TAGS)" | tr ',' '\n' | grep -v -E "^($COMMIT_SHA|latest)$"); do
                    if [ -n "$TAG" ]; then
                      gcloud artifacts docker images delete "$IMAGE_BASE:$TAG" --quiet --delete-tags
                    fi
                  done

            - name: Upload client to GCS
              run: |
                  gsutil -m rsync -d -r build gs://${{ vars.GCP_BUCKET }}
